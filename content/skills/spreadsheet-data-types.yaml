note: |
  # Data types

  A spreadsheet tells numbers, text, dates and formulas apart internally, so a value which looks like a number is not always treated as one.

  ## The 30-second answer

  - Every cell stores its content as one type: most often a number, text, a date, or a formula.
  - A real number is right-aligned by default. Text, including text that looks like a number, is left-aligned.
  - Math functions such as a total or an average only count real numbers. They quietly skip anything stored as text.
  - A date is secretly stored as a plain number counting days from a fixed starting point, which is why dates can be added and subtracted.
  - Data that arrives from outside the sheet, such as a CSV import, often arrives as text even when it looks exactly like a number.

  ## What it means

  A cell's data type is not something you usually choose on purpose. It is decided by how the value got there: typing `120` gives you a real number, typing `120` with a leading character that forces text mode, or pasting it in from a system that exports everything as text, gives you something that looks identical on screen but behaves completely differently in a formula.

  This matters because a spreadsheet trusts the stored type completely and the screen almost never shows you what that type actually is. Two cells can both display `120`, one ready to be added up correctly and one that a total formula will walk straight past as if it were not there. The only reliable way to tell them apart is to check, not to look.

  ## How it works

  | Type | Example | Default alignment | Behaves in math as |
  |---|---|---|---|
  | Number | `120`, `3.5` | Right | A real value |
  | Text | `Notebook` | Left | Not a value. Skipped by SUM, AVERAGE and similar functions |
  | Date | `05/01/2026` | Right | A number counting days, which is why dates can be subtracted |
  | Formula | `=B2*C2` | Matches the result's type | Whatever type its result turns out to be |

  What happens, in order, when a number arrives as text:

  1. A value that looks like a number is typed or imported in a way that stores it as text.
  2. The cell shows the value, left-aligned, with nothing marking it as wrong.
  3. A total formula that includes that cell in its range runs normally, with no error.
  4. The result is lower than expected, because the text-stored value was silently treated as if it were not there.

  ## Example

  A new column, `Date purchased`, is added to the January worksheet, holding a real date for each item.

  | | A | B | E |
  |---|---|---|---|
  | 1 | Item | Price | Date purchased |
  | 2 | Notebook | 2 | 05/01/2026 |
  | 3 | Pen | 1 | 05/01/2026 |
  | 4 | Eraser | 1 | 06/01/2026 |
  | 5 | Ruler | 3 | 06/01/2026 |

  Each date is right-aligned, confirming it is stored as a real date rather than as text that happens to read like one.

  | Input | Result | What it does |
  |---|---|---|
  | A real date typed into E2 | Right-aligned, usable in date maths | Stored as a number counting days, so it can be compared or subtracted |
  | The same date pasted in as plain text | Left-aligned, looks identical | Cannot be used in date maths without first converting it |

  **Where it bites**

  Correct version: B2 through B5 all hold real numbers, right-aligned, and the total formula `=SUM(B2:B5)` in B6 correctly shows 7.

  Wrong version: Ruler's price in B5 was pasted in from another system and landed as text, left-aligned, but still displaying `3` exactly like the others.

  Both versions show a full column of prices that look identical at a glance. The total formula runs with no error in either case, but in the wrong version it silently skips B5, so B6 shows 4 instead of 7. Nothing about the grid marks Ruler's price as different from the rest: no colour, no icon, no warning, only a total that is quietly short by exactly the value that got skipped.

  ## When to use it

  **Use it when** you import data from another system, especially a CSV file, and need to confirm the numbers and dates arrived as real numbers and dates rather than text that only looks like them.

  **Use something else when** you are troubleshooting a formula that is producing an outright error rather than a silently wrong number. A mismatched data type usually causes a quietly wrong result, not a visible error.

  **Never** trust a value's appearance alone when a total looks lower than it should. Check the alignment, or use a function built to test the type directly.

  ## Common mistakes

  - "My total is lower than it should be but there is no error." One or more of the summed cells is storing a number as text. Check each cell's alignment: text sits left, real numbers sit right.
  - "I imported a CSV and none of my totals work." CSV imports very often bring numbers in as text. Convert the column to real numbers before calculating with it.
  - "A date formula is not working even though the cell shows a date." The cell holds text that reads like a date, not a real date. Only a real date, right-aligned, can be used in date maths such as counting days between two of them.
  - "I fixed one cell but the total still looks wrong." Data type problems are usually not limited to one cell. Check the whole range the formula covers, not only the value that first caught your eye.

  ## Interview questions

  1. What are the main data types a spreadsheet cell can hold?

  <details><summary>Answer</summary>Number, text, date and formula are the main ones. A date is a special case of a number, and a formula's type depends on whatever its result turns out to be.</details>

  2. Why can a real date be subtracted from another date to get a number of days?

  <details><summary>Answer</summary>Because a date is not stored as the words you see. It is stored as a plain number counting days from a fixed starting point, so subtracting two dates is really subtracting two numbers, and the result naturally comes out as a count of days.</details>

  3. A SUM formula returns a number lower than you expect, with no error shown. What do you check first?

  <details><summary>Answer</summary>Whether every cell inside the formula's range is actually stored as a real number, by checking its alignment. A number stored as text is left-aligned and is silently skipped by SUM, which produces a plausible but too-low total with no warning.</details>

  4. When would you specifically check a column's data type before doing anything else with it?

  <details><summary>Answer</summary>Right after importing data from an outside source, such as a CSV file or another system's export, since those very often bring numbers and dates in as plain text even though they display normally.</details>

  5. Explain why a spreadsheet can silently give a wrong total, to a colleague who has never heard the term `data type`.

  <details><summary>Answer</summary>A spreadsheet does not only look at what a value looks like on screen, it remembers whether that value is really a number or only text shaped like one. If a number gets stored as text by mistake, a total that adds up a column of numbers walks right past it as if the cell were empty, and nothing on screen warns you that happened.</details>

