note: |
  # Cell references

  A cell reference is how a formula points at another cell's value by its address, so the formula's result updates automatically whenever that cell changes.

  ## The 30-second answer

  - A reference is an address, such as B2, written inside a formula instead of a typed number.
  - A formula that reads `=B2*C2` always uses whatever is currently in B2 and C2, not whatever those cells held when the formula was written.
  - Change either referenced cell, and the formula's result updates on its own, with no retyping.
  - Copying a formula to a new row shifts its references to match that row, unless it was deliberately locked in place.
  - A formula can reference a cell on the same sheet, a range of cells, or a cell on a different worksheet.

  ## What it means

  A formula built from references does not store a result, it stores a set of instructions for finding one. `=B2*C2` does not mean "6". It means "multiply whatever is in B2 by whatever is in C2, right now." That distinction is the entire reason a spreadsheet can stay correct after a value changes: nothing needs to be recalculated by hand, because every formula that reads the changed cell recalculates itself the moment it changes.

  This only works because a reference is followed exactly, not approximately. A reference to B2 always means B2, never "roughly that area" or "whatever used to be there." That precision is also where mistakes creep in: a reference that is one row or one column off from the one you meant still points at a real cell and still returns a real number, so nothing about the result looks broken.

  ## How it works

  | Reference | Points at |
  |---|---|
  | `B2` | One specific cell on the current sheet |
  | `B2:B5` | A range of cells on the current sheet |
  | `January!B2` | A specific cell on a different worksheet, named `January` |

  What happens, in order, when you copy a formula down a column:

  1. You write a formula in one cell, such as `=B2*C2` in D2.
  2. You copy that cell and paste it into the cell below, D3.
  3. The reference shifts by one row to match: the pasted formula reads `=B3*C3`, not `=B2*C2`.
  4. Repeating this down the column gives every row a formula that reads its own row, not the first row's.

  ## Example

  A `Line total` column, D, is added to the January worksheet: each row's price multiplied by its quantity.

  | | A | B | C | D |
  |---|---|---|---|---|
  | 1 | Item | Price | Quantity | Line total |
  | 2 | Notebook | 2 | 1 | 2 |
  | 3 | Pen | 1 | 3 | 3 |
  | 4 | Eraser | 1 | 2 | 2 |
  | 5 | Ruler | 3 | 1 | 3 |

  D2 holds the formula `=B2*C2`. Copying D2 down to D3, D4 and D5 gives each row its own correct formula: `=B3*C3`, `=B4*C4`, `=B5*C5`.

  | Input | Result | What it does |
  |---|---|---|
  | `=B2*C2` typed in D2 | D2 shows `2` | Multiplies Notebook's price by its quantity |
  | D2 copied down to D3:D5 | Each row shows its own correct line total | Shifts the references to match each new row automatically |

  **Where it bites**

  Correct version: D2 through D5 hold `=B2*C2`, `=B3*C3`, `=B4*C4`, `=B5*C5`, each row correctly multiplying its own price by its own quantity.

  Wrong version: D3 was typed by hand instead of copied down, and reads `=B2*C3`, Notebook's price multiplied by Pen's quantity, giving 6 instead of the correct 3.

  Both versions show a full column of plausible-looking numbers, no errors anywhere. The wrong version's total across D2:D5 comes to 13 instead of the correct 10, and nothing on the sheet points at row 3 as the source of the difference. The only way to catch it is to check each row's formula individually.

  ## When to use it

  **Use it when** a formula's result depends on a value that lives in another cell, which is almost always: prices, quantities, rates, and totals all belong in their own cells and get referenced, not retyped.

  **Use something else when** a number genuinely never changes and has no source cell of its own, such as a fixed constant used only once. Even then, giving it its own labelled cell and referencing it is usually still clearer.

  **Never** type a value directly into a formula when that value already lives in a cell somewhere on the sheet. Reference the cell instead.

  ## Common mistakes

  - "My total looks right today but I do not trust it." Some cell in the formula chain may hold a typed value instead of a reference, which means it will not update the next time the source data changes. Check the formula bar, not only the result.
  - "I copied a formula down and one row looks off." The formula in that row may have been typed by hand instead of copied, giving it references that do not match its row. Compare the formula in the odd row against the ones above and below it.
  - "I referenced a cell and got a value from last week." The formula is referencing a cell that has since been moved or overwritten with something else, not the cell you originally meant. Click the formula and check exactly which address it points at.
  - "Everything after row 20 is wrong." A single early formula in that column was likely typed with a fixed reference instead of copied, and every row after it inherited the mistake by being copied from the wrong source.

  ## Interview questions

  1. What does a cell reference actually store inside a formula?

  <details><summary>Answer</summary>An address, not a value. The formula reads whatever is currently in that address every time it recalculates, rather than storing a fixed number from when it was written.</details>

  2. Why does copying a formula down a column change the row numbers inside it?

  <details><summary>Answer</summary>Because a plain reference is relative to the cell it is written in. When the formula is copied to a new row, the reference shifts by the same number of rows so it keeps pointing at the value in its own row, rather than always pointing back at the original row.</details>

  3. A column of line totals looks fine except one row seems too high. What do you check first?

  <details><summary>Answer</summary>The exact formula in that one row, by clicking the cell and reading the formula bar. A row that was typed by hand instead of copied down often ends up referencing the wrong row, giving a plausible but wrong number.</details>

  4. When would you reference a cell on a different worksheet instead of copying its value over?

  <details><summary>Answer</summary>Whenever the value already exists somewhere else and might change, such as pulling a total from a raw data sheet onto a summary sheet. Referencing it keeps the summary correct automatically. Copying the value over freezes it at whatever it was on the day you copied it.</details>

  5. Explain what a cell reference is to a colleague who has never written a formula, without using the word `formula`.

  <details><summary>Answer</summary>It is a way of telling a cell to look at another cell's value instead of typing that value in directly. If the other cell's value changes later, the one pointing at it changes too, automatically, without anyone having to update it by hand.</details>

