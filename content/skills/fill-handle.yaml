title: Fill Handle
category: Spreadsheets
what_is_it: The small square at the bottom-right corner of a selected cell that copies or extends its content into adjacent cells when dragged.
why_it_matters: It is the fastest way to repeat a formula or a value down a column or across a row, and it overwrites whatever is already in its path with no warning.
