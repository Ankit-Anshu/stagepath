note: |
  # Worksheet

  A worksheet is one grid inside a workbook, shown as a tab along the bottom, holding its own separate set of rows and columns.

  ## The 30-second answer

  - A worksheet is one grid: rows, columns and cells, shown as one tab in the workbook.
  - A workbook can hold several worksheets, each independent of the others unless a formula links them.
  - The active worksheet is the one tab currently on screen. Typing only affects that tab.
  - Worksheets can be renamed, reordered, or coloured, which does not change the data on them.
  - A formula can pull a value from a different worksheet by naming that sheet before the cell address.

  ## What it means

  A worksheet is where the actual work happens: the grid you type into, format, and write formulas in. The workbook around it is only the file that carries one or more of these grids together. Two worksheets in the same workbook do not share data automatically. A cell on one tab and a cell in the same position on another tab are two entirely separate cells, and changing one has no effect on the other unless a formula on one deliberately points at the other.

  This is why naming worksheets clearly matters more than it first seems. A workbook left with tabs named `Sheet1`, `Sheet2` and `Sheet3` gives no clue which one holds which data, and the only way to check is to click through each one. A worksheet named for what it actually holds turns that guesswork into a glance.

  ## How it works

  | Action | How |
  |---|---|
  | Switch worksheet | Click a different tab along the bottom |
  | Rename a worksheet | Double-click the tab and type a new name |
  | Add a worksheet | Click the add-tab button next to the existing tabs |
  | Reference another worksheet | Write the sheet name, an exclamation mark, then the cell address |

  What happens, in order, when a formula reaches across sheets:

  1. You are on one worksheet and start a formula.
  2. You click a tab for a different worksheet.
  3. You click a cell on that worksheet.
  4. The formula records that cell's address together with the worksheet's name, so it keeps pointing at the right sheet even after you switch back.

  ## Example

  The workbook now holds two worksheets: `Sheet1`, the January shopping list (Notebook, Pen, Eraser, Ruler, priced 2, 1, 1, 3, total 7 in B6), and `Sheet2`, a separate February list with its own items and its own total.

  Both tabs are renamed so they can be told apart at a glance.

  | Before | After |
  |---|---|
  | `Sheet1` | `January` |
  | `Sheet2` | `February` |

  | Input | Result | What it does |
  |---|---|---|
  | Click the `February` tab | The grid now shows February's list, not January's | Confirms which worksheet is active before typing anything |
  | A formula on `February` referencing `January`'s total | Shows January's total number on the February tab | Pulls one value across sheets without duplicating the data |

  **Where it bites**

  Correct version: two tabs, clearly labelled `January` and `February`, each holding its own list.

  Wrong version: two tabs still labelled `Sheet1` and `Sheet2`, both showing a similar-looking list of four items and a total.

  Both workbooks look almost identical at a glance, tab bar included. Nothing marks either tab as the wrong one to edit. A person meaning to update January's prices, but clicking whichever tab happens to be active, can edit February's numbers instead, and the sheet still looks completely normal afterward: a list, some prices, a total, only for the wrong month.

  ## When to use it

  **Use it when** you have more than one distinct set of data that belongs in the same workbook, such as one month per tab, or raw data kept apart from a summary.

  **Use something else when** the data does not actually need to be kept apart. Splitting one small, single list across several worksheets for no reason only adds tabs to click through.

  **Never** leave more than one or two worksheets with their default name. Rename a tab as soon as you know what it is for.

  ## Common mistakes

  - "I edited the wrong list and did not notice." You typed without checking the tab bar first. Confirm the active tab's name before making changes, especially in a workbook with several similar-looking sheets.
  - "I have three tabs and I cannot tell which is which." They were left with their default names. Rename every tab as soon as its purpose is clear, not at the end of the project.
  - "My cross-sheet formula broke after I deleted a tab." A formula pointing at a worksheet that no longer exists cannot find its data and returns an error. Check which sheets a formula depends on before deleting one.
  - "I have two tabs that look the same and I am not sure they hold different data." Two worksheets with the same layout are still two separate grids. Click into each one and check its cells rather than assuming from the shape alone.

  ## Interview questions

  1. What is the relationship between a worksheet and a workbook?

  <details><summary>Answer</summary>A worksheet is one grid, shown as a tab, and a workbook is the file that holds one or more worksheets together. Every worksheet belongs to exactly one workbook.</details>

  2. Why doesn't editing a cell on one worksheet ever change the same-looking cell on another worksheet?

  <details><summary>Answer</summary>Because each worksheet is its own separate grid. A cell's position, such as B2, only means something within the one worksheet it sits on. Two worksheets never share cells unless a formula on one is written to specifically pull a value from the other.</details>

  3. Someone says a number on their summary tab looks stale. What do you check first?

  <details><summary>Answer</summary>Whether the summary tab's formulas actually reference the other worksheet's current cells, and whether those source cells have been renamed, moved, or deleted since the formula was written. A broken cross-sheet reference often still shows a number, only an outdated one.</details>

  4. When would you split data across multiple worksheets instead of keeping it on one?

  <details><summary>Answer</summary>When the data serves genuinely different purposes, such as raw entries on one sheet and a calculated summary on another, or one period's figures per tab. If the data is small and always used together, one worksheet is simpler and avoids unnecessary cross-sheet formulas.</details>

  5. Explain what a worksheet is to a colleague who already knows what a workbook is, without using the word `tab`.

  <details><summary>Answer</summary>A worksheet is one page of the workbook: its own grid of rows and columns, separate from every other page in the same file. You can have several of these pages inside one workbook, and you switch between them to see one page's data at a time.</details>

