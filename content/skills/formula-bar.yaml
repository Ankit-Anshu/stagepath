note: |
  # Formula bar

  The formula bar is the strip above the grid that shows and edits a selected cell's raw content, separate from the result the grid displays.

  ## The 30-second answer

  - The formula bar sits above the grid and shows the raw content of whichever cell is currently selected.
  - Raw content means what was actually typed: a plain value, or a formula, not the number the grid shows as a result.
  - Editing inside the formula bar changes a cell's content directly, the same as editing inside the cell itself.
  - A cell showing a number tells you nothing about whether that number is fixed or calculated. The formula bar does.
  - Pressing Enter after editing in the formula bar commits the change, exactly like pressing Enter after typing in the cell.

  ## What it means

  The grid is built to be read quickly: every cell shows one clean result, and nothing about its appearance says how that result was produced. The formula bar exists because sometimes you need to know exactly that, whether a number is a fixed value someone typed once, or a formula that recalculates every time something it depends on changes.

  This becomes important the moment you need to trust a number rather than only read it. A total that looks correct today might be a live formula that will keep being correct, or it might be a number someone typed in once and will slowly go stale as the data around it changes. From the grid alone, both look identical. The formula bar is what tells them apart.

  ## How it works

  | Situation | What the formula bar shows |
  |---|---|
  | Cell holds a typed number | That exact number, nothing else |
  | Cell holds a typed word | That exact word, nothing else |
  | Cell holds a formula | The full formula, starting with an equals sign |
  | No cell selected | Empty |

  What happens, in order, when you edit a formula through the formula bar instead of the cell:

  1. You click the cell whose formula you want to check.
  2. The formula bar shows its full content, including the equals sign if it is a formula.
  3. You click inside the formula bar and make your change there.
  4. You press Enter, and the cell recalculates using the edited formula.

  ## Example

  A `Grand total` is added in cell D6, adding up every line total in the January worksheet.

  | | A | B | C | D |
  |---|---|---|---|---|
  | 2 | Notebook | 2 | 1 | 2 |
  | 3 | Pen | 1 | 3 | 3 |
  | 4 | Eraser | 1 | 2 | 2 |
  | 5 | Ruler | 3 | 1 | 3 |
  | 6 | | | | 10 |

  Clicking D6 shows `10` in the grid. The formula bar shows the real content behind it.

  | Input | Result | What it does |
  |---|---|---|
  | Click D6 with a formula behind it | Grid shows `10`, formula bar shows `=SUM(D2:D5)` | Confirms the total is live and will update if any line total changes |
  | Click D6 with a typed value instead | Grid shows `10`, formula bar shows `10` | Confirms the total is fixed and will not change even if the line totals do |

  **Where it bites**

  Correct version: D6 holds `=SUM(D2:D5)`, currently showing `10`, and will keep showing the true total as prices or quantities change.

  Wrong version: someone double-clicked D6, meant to check its formula, but instead accidentally typed over it, replacing `=SUM(D2:D5)` with the plain number `10`, since it happened to match at the time.

  Both cells show exactly `10` right now, and both look completely normal. The difference only shows up the next time a price changes: the correct version updates on its own, and the broken one keeps showing `10` forever, silently wrong from that point on, with nothing on screen marking it as broken.

  ## When to use it

  **Use it when** you need to confirm whether a number is a live formula or a fixed value, or when a formula is too long to read comfortably inside the cell itself.

  **Use something else when** you already know a cell holds a simple typed value and only need to change it. Double-clicking the cell directly is equally fast for something that short.

  **Never** assume a total is a live formula only because it looks like one. Check the formula bar before relying on it to update automatically.

  ## Common mistakes

  - "My total stopped updating and I do not know when." The formula behind it was likely overwritten with a typed value at some point, probably by accident while editing directly in the cell. Check the formula bar to see whether a formula is still there.
  - "I meant to check a formula but ended up changing it." Double-clicking a cell puts it straight into edit mode, so a stray keystroke can alter it immediately. Click once and read the formula bar instead if you only want to check, not edit.
  - "A formula is too long to read in the cell." The cell only shows as much as its column width allows. The formula bar shows the entire thing on one line, however long it is.
  - "I am not sure if this cell is empty or only shows nothing." An empty-looking cell can still hold a formula that currently evaluates to a blank result. Click it and check the formula bar rather than judging by the grid alone.

  ## Interview questions

  1. What does the formula bar show that the grid does not?

  <details><summary>Answer</summary>The raw content of the selected cell: a typed value exactly as it was entered, or the full text of a formula starting with an equals sign, rather than only the calculated result the grid displays.</details>

  2. Why can two cells that both show the same number actually be completely different underneath?

  <details><summary>Answer</summary>Because the grid only shows a result, not how that result was produced. One cell might hold a live formula that recalculates automatically, and the other might hold that exact same number typed in by hand. Both display identically until the data behind the formula changes and only one of them updates.</details>

  3. A total that used to update automatically has stopped changing. What do you check first?

  <details><summary>Answer</summary>Click the total cell and read its content. If a formula used to be there and is now missing, replaced by a plain typed number, that explains why it stopped updating, and the fix is to rebuild the formula.</details>

  4. When would checking a value through the strip above the grid matter more than only reading the cell?

  <details><summary>Answer</summary>Any time you need to trust a number going forward rather than only read it once, such as before relying on a total in a report. Reading the cell tells you what the value is right now. Checking its raw content tells you whether it will still be correct after the underlying data changes.</details>

  5. Explain what this part of the screen is for, to a colleague who has never used a spreadsheet, without using the word `bar`.

  <details><summary>Answer</summary>It is a strip above the grid that shows exactly what you typed into whichever cell is selected, instead of only the result that cell displays. If that cell holds a calculation, this is where you see the actual calculation, not only its answer.</details>

