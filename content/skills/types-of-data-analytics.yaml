title: Types of Data Analytics
category: Foundations
what_is_it: The four categories of analytics — descriptive, diagnostic, predictive, and prescriptive — and what kind of question each one answers.
why_it_matters: Knowing which type of analytics a question actually calls for keeps you from over- or under-engineering an answer. Not every question needs a predictive model, and not every question is answered by a summary chart.
prerequisites: []
objectives:
  - Distinguish descriptive from diagnostic analytics
  - Explain what predictive analytics adds beyond description
  - Explain what prescriptive analytics adds beyond prediction
  - Match a business question to the right type of analytics
subtopics:
  - title: Descriptive Analytics
    description: Summarizing what already happened — totals, trends, and historical reporting.
    outcomes:
      - Identify a question that only needs descriptive analytics
  - title: Diagnostic Analytics
    description: Investigating why something happened by drilling into drivers and segments.
    outcomes:
      - Diagnose a metric change by segmenting the data
  - title: Predictive Analytics
    description: Using historical data to estimate what is likely to happen next.
    outcomes:
      - Explain what predictive analytics requires that descriptive analytics doesn't
  - title: Prescriptive Analytics
    description: Recommending a specific action based on a prediction, not just forecasting it.
    outcomes:
      - Explain the difference between predicting an outcome and prescribing an action
