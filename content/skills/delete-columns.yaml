title: Delete Columns
category: Spreadsheets
what_is_it: Removing one or more entire columns from the sheet, closing the gap by shifting every column after it left, and breaking any formula that pointed directly at a cell in that column.
why_it_matters: A field that looks unused in the visible part of a sheet can still be read by a formula sitting far away, and deleting its column removes both at once with no warning.
