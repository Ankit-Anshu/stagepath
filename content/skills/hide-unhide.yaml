title: Hide Unhide
category: Spreadsheets
what_is_it: Collapsing a row or column so it does not show on screen, without removing its data or breaking anything that reads it.
why_it_matters: A hidden row or column still calculates normally, so a total that looks unexplained often has a perfectly good reason sitting out of view.
