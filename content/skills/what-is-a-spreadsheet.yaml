  # What is a spreadsheet

  A spreadsheet is a grid of cells where you store numbers and text and let the program calculate results for you.

  `Level: foundational` · `Read: 4 min` · `Practice: 0.5 hour` · `Before this: none, this is the first topic` · `After this: Spreadsheet interface`

  ---

  ## The 30-second answer

  - A spreadsheet is a grid made of rows and columns, and the box where a row and a column cross is called a cell.
  - Each cell holds one piece of data: a number, a word, a date or a formula.
  - A worksheet is one grid. A workbook is the file that can hold several worksheets at once.
  - Change one cell, and every other cell that depends on it updates on its own.
  - People use spreadsheets to track lists, run budgets, and answer "what happens if I change this number" questions.

  ---

  ## What it means

  A spreadsheet is a way of storing information so that each fact has its own place. Instead of writing "Notebook costs 2 dollars" as a sentence, you put "Notebook" in one box and "2" in the box next to it. That box is called a cell, and every cell sits at the meeting point of one row and one column, so it always has an exact address, such as B3.

  Without a spreadsheet, the same job gets done on paper or in a plain document, and every calculation has to be worked out by hand. If a price changes, you cross out the old total and recalculate the new one yourself. A spreadsheet removes that step: once a cell is set up to add up other cells, it keeps that total correct on its own, every time one of those numbers changes.

  This is why a spreadsheet is not the same thing as a table in a document. A table there holds fixed text. A spreadsheet holds live numbers: it remembers where each one lives and reacts when one of them changes.

  ---

  ## How it works

  | Part | What it is |
  |---|---|
  | `Workbook` | The whole file. It can hold one worksheet or many. |
  | `Worksheet` | One grid inside the workbook. Workbooks show worksheets as tabs. |
  | `Row` | A horizontal line of cells, numbered 1, 2, 3 and so on. |
  | `Column` | A vertical line of cells, labelled A, B, C and so on. |
  | `Cell` | The box where one row and one column meet. Every cell has an address, such as B3. |
  | `Cell reference` | The address of a cell, made from its column letter and its row number. |

  What happens, in order, when you enter data:

  1. You open a workbook, which shows one worksheet at a time.
  2. You click a cell, which selects it and shows its address.
  3. You type a value, which is stored in that exact cell and nowhere else.
  4. You move to another cell, and the value you typed stays where you put it.

  ---

  ## Worked example

  A 4-item shopping list: Notebook, Pen, Eraser and Ruler, priced at 2, 1, 1 and 3. Each item goes in its own row in column A, with its price next to it in column B.

  | | A | B |
  |---|---|---|
  | 1 | Item | Price |
  | 2 | Notebook | 2 |
  | 3 | Pen | 1 |
  | 4 | Eraser | 1 |
  | 5 | Ruler | 3 |

  Every row follows the same shape: one item name in column A, one price in column B. That pattern is what makes row 6 possible: a cell set up to add every price from B2 to B5, instead of a typed number.

  | | A | B |
  |---|---|---|
  | 6 | Total | 7 |

  | Input | Result | What it does |
  |---|---|---|
  | `2` typed into cell B2 | B2 shows `2` | Stores one price in its own cell, separate from every other price |
  | An instruction in B6 to add B2 through B5 | B6 shows `7` | Adds every price above it, and updates on its own if any of them change |

  **Where it bites**

  Correct version, prices typed starting from B2:

  | | A | B |
  |---|---|---|
  | 2 | Notebook | 2 |
  | 3 | Pen | 1 |
  | 4 | Eraser | 1 |
  | 5 | Ruler | 3 |

  Wrong version, where the first click landed on B3 instead of B2, so every price ended up one row too low:

  | | A | B |
  |---|---|---|
  | 2 | Notebook | (empty) |
  | 3 | Pen | 2 |
  | 4 | Eraser | 1 |
  | 5 | Ruler | 1 |
  | 6 | Total | 3 |

  Both grids look like a finished shopping list. Nothing on the screen marks the second one as wrong: no red text, no warning, no error. Notebook now appears to cost nothing and Ruler appears to cost 1, and the total in row 6 is not a total at all: it holds Ruler's price, sitting in the wrong cell.

  ---

  ## When to use it

  **Use it when** you have a list of similar items, at least one number attached to each one, and you expect that number to change or to need a total.

  **Use something else when** you are writing a document made of paragraphs, or storing thousands of related records that many people need to update safely at the same time. A word processor fits the first case, and a database fits the second.

  **Never** put the same fact in two different cells and update them by hand separately. If two cells are meant to hold the same value, make one of them refer to the other instead of retyping it.

  ---

  ## Common mistakes

  - "I typed the price in, but I cannot find it now." You clicked a different cell than the one you meant to before typing, so the value landed somewhere else. Check the cell reference box for the address before you type.
  - "I have several lists and I cannot tell which one I am looking at." You are treating the workbook, the whole file, and the worksheet, one tab inside it, as the same thing. Check the sheet tabs at the bottom before you add new data.
  - "My old data is gone and I did not delete anything." You clicked on a cell that already held a value and typed straight over it. A cell's old content disappears with no warning, so check what is already there before you type into it.
  - "I asked for B2 and got the wrong box." You mixed up which axis is which. Columns run left to right and use letters, rows run top to bottom and use numbers, so B2 means column B, row 2.
  - "I do not see why this beats a plain document." You are using the grid like one long block of text instead of one value per cell. A spreadsheet only pays off once each fact has its own cell, because that is what lets it be found and recalculated on its own.

  ---

  ## Interview questions

  1. What are the four building blocks of any spreadsheet?

  <details><summary>Answer</summary>A workbook, the file, a worksheet, one grid inside it, rows and columns, and a cell, where a row and a column meet.</details>

  2. Why does a spreadsheet organize data into a grid of cells instead of one continuous block of text?

  <details><summary>Answer</summary>Because each cell has its own address, a spreadsheet can store, find and recalculate one exact value without touching anything else on the sheet. A block of text has no addresses, so nothing in it can be targeted or updated on its own.</details>

  3. Someone types a number into a cell, and the number is nowhere on screen afterward. What do you check first?

  <details><summary>Answer</summary>Check which cell was actually selected before the value was typed, using the cell reference box. The value almost always landed in a different cell than the one the person meant to use.</details>

  4. When would you reach for a spreadsheet instead of a plain document?

  <details><summary>Answer</summary>When the content is a list of similar items with at least one number attached to each one, especially if that number might change or needs to be totalled. A document is the better choice once the content is mostly sentences and paragraphs rather than repeated rows of data.</details>

  5. Explain what a spreadsheet is to a colleague who has never used one, without using the word `cell`.

